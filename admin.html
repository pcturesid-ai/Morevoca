<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Morevoca Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/brand/favicon-64.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="js/config/tailwind.config.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="bg-[#F5F7FB] text-slate-800 font-sans antialiased selection:bg-brand-100 selection:text-brand-600" style="overflow-x: clip">
  <!-- Backdrop Mobile Sidebar -->
  <div id="sidebarOverlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-40 hidden lg:hidden transition-opacity"></div>

  <!-- Wrapper Utama Aplikasi -->
  <div class="min-h-screen flex">

    <!-- =========================================================
         1. SIDEBAR KIRI (Fixed ~250px Desktop, Drawer Mobile)
    ========================================================== -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-[256px] shrink-0 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 -translate-x-full lg:translate-x-0">
      
      <!-- Brand Header -->
      <div class="px-5 pt-5 pb-4 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('dashboard')">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#C2410C] to-[#EA580C] flex items-center justify-center text-white shadow-[0_6px_14px_rgba(194,65,12,0.28)] shrink-0">
            <i data-lucide="aperture" class="w-5 h-5"></i>
          </div>
          <div class="leading-tight">
            <h1 class="font-bold text-[15px] text-slate-900 tracking-tight">Morevoca</h1>
            <p class="text-[11.5px] font-medium text-slate-400">Wedding Workspace</p>
          </div>
        </div>
        <!-- Tombol tutup sidebar khusus mobile -->
        <button onclick="toggleSidebar(false)" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600" aria-label="Tutup Menu">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Menu Navigasi Interaktif -->
      <nav id="sidebarNav" class="flex-1 overflow-y-auto px-3.5 py-2 space-y-1">
        <!-- Item menu dirender dinamis oleh JavaScript -->
      </nav>

      <!-- Shortcut Bawah Sidebar -->
      <div class="p-4 mt-auto">
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#C2410C] via-[#D4531A] to-[#EA580C] p-4 text-white shadow-soft">
          <div class="absolute -right-5 -top-5 w-20 h-20 rounded-full bg-white/10 pointer-events-none"></div>
          <div class="absolute right-2 bottom-10 w-10 h-10 rounded-full bg-white/10 flex items-center justify-center pointer-events-none">
            <i data-lucide="globe" class="w-5 h-5 text-orange-100"></i>
          </div>
          <h3 class="font-bold text-[14px] leading-snug pr-8">Halaman Portofolio</h3>
          <p class="text-[11.5px] text-orange-100/90 mt-1.5 leading-relaxed pr-6">
            Lihat tampilan publik yang dilihat klien potensial.
          </p>
          <a href="/" target="_blank" class="mt-3.5 w-full py-2 px-3 bg-white text-[#C2410C] hover:bg-orange-50 active:scale-[0.98] transition-all rounded-xl font-semibold text-xs shadow-sm flex items-center justify-center gap-1.5">
            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
            Buka Portofolio
          </a>
        </div>
      </div>
    </aside>

    <!-- =========================================================
         AREA KONTEN KANAN (Top Header + Main Workspace)
    ========================================================== -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- =========================================================
           2. TOP HEADER BAR (Putih, Sticky)
      ========================================================== -->
      <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 sm:px-6 lg:px-8 h-[68px] flex items-center justify-between gap-3">
        
        <!-- Kiri: Hamburger + Judul Halaman -->
        <div class="flex items-center gap-3 min-w-0">
          <button onclick="toggleSidebar()" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors" aria-label="Toggle Sidebar">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div class="flex items-center gap-2.5 min-w-0">
            <h2 id="pageTitle" class="text-[17px] sm:text-[18px] font-bold text-slate-900 truncate">Dashboard</h2>
          </div>
        </div>

        <!-- Kanan: Pencarian, Tombol Proyek Baru, Notifikasi, Profil -->
        <div class="flex items-center gap-2 sm:gap-3">

          <!-- Pencarian Proyek & Klien Interaktif -->
          <div class="relative">
            <div class="flex items-center bg-slate-50 hover:bg-slate-100/80 focus-within:bg-white focus-within:ring-2 focus-within:ring-[#C2410C]/20 focus-within:border-[#C2410C] border border-slate-200/80 rounded-xl px-3 py-1.5 transition-all w-[140px] sm:w-[220px] md:w-[260px]">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0 mr-2"></i>
              <input
                id="globalSearchInput"
                type="text"
                placeholder="Cari proyek, klien..."
                oninput="handleGlobalSearch(this.value)"
                onfocus="handleGlobalSearch(this.value)"
                class="bg-transparent text-xs sm:text-[13px] text-slate-700 placeholder:text-slate-400 focus:outline-none w-full"
              />
              <button id="clearSearchBtn" onclick="clearGlobalSearch()" class="hidden text-slate-400 hover:text-slate-600 ml-1">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
              </button>
            </div>
            <!-- Dropdown Hasil Pencarian Cepat -->
            <div id="searchDropdown" class="hidden absolute right-0 mt-2 w-[300px] sm:w-[340px] bg-white rounded-2xl shadow-xl border border-slate-100 p-2 z-50">
              <!-- Diisi dinamis JS -->
            </div>
          </div>

          <!-- Tombol Quick Add Proyek (Desktop/Tablet) -->
          <button onclick="openProjectForm()" class="hidden sm:inline-flex items-center gap-1.5 bg-[#C2410C] hover:bg-[#9A3412] active:scale-[0.98] text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-sm transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Proyek Baru</span>
          </button>

          <!-- Tombol Notifikasi + Dropdown -->
          <div class="relative">
            <button id="notifBtn" onclick="toggleDropdown('notifDropdown')" class="relative p-2.5 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors" aria-label="Notifikasi">
              <i data-lucide="bell" class="w-5 h-5"></i>
              <span id="notifBadge" class="absolute top-1.5 right-1.5 w-4 h-4 rounded-full bg-[#C2410C] text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white">3</span>
            </button>

            <!-- Dropdown Notifikasi -->
            <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-[310px] sm:w-[350px] bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden z-50 animate-fade-in">
              <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                <div>
                  <h4 class="text-sm font-bold text-slate-900">Perlu ditindaklanjuti</h4>
                  <p class="text-[11px] text-slate-400">Pertanyaan, testimoni & jadwal</p>
                </div>
              </div>
              <div id="notifList" class="max-h-[300px] overflow-y-auto divide-y divide-slate-50">
                <!-- Diisi dinamis JS -->
              </div>
            </div>
          </div>

          <!-- Profil Pengguna -->
          <div class="relative pl-1 sm:pl-2 border-l border-slate-100">
            <button onclick="toggleDropdown('profileDropdown')" class="flex items-center gap-2.5 p-1 rounded-xl hover:bg-slate-50 transition-colors text-left">
              <div class="w-9 h-9 rounded-full bg-gradient-to-br from-[#C2410C] to-[#EA580C] text-white font-bold text-xs flex items-center justify-center ring-2 ring-orange-50 shrink-0">
                <i data-lucide="user" class="w-4 h-4"></i>
              </div>
              <div class="hidden md:block leading-tight">
                <p class="text-[13px] font-bold text-slate-800" data-user-name>Admin</p>
                <p class="text-[11px] text-slate-400 font-medium">Pemilik studio</p>
              </div>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 hidden md:block"></i>
            </button>

            <!-- Dropdown Profil -->
            <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-slate-100 p-1.5 z-50 animate-fade-in">
              <div class="px-3 py-2.5 border-b border-slate-100 mb-1">
                <p class="text-xs font-bold text-slate-800" data-user-name>Admin</p>
                <p class="text-[11px] text-slate-400" data-user-email></p>
              </div>
              <button onclick="logout()" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium text-rose-600 hover:bg-rose-50">
                <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
              </button>
            </div>
          </div>

        </div>
      </header>

      <!-- =========================================================
           MAIN WORKSPACE CONTAINER (Konten Dinamis Semua Tab)
      ========================================================== -->
      <main id="mainContent" class="flex-1 p-4 sm:p-6 lg:p-7 max-w-[1600px] w-full mx-auto">
        <!-- Dirender oleh renderApp() -->
      </main>

    </div>
  </div>
  <div id="toastContainer" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-2 pointer-events-none"></div>

  <!-- =========================================================
       JAVASCRIPT LOGIC & STATE MANAGEMENT
  ========================================================== -->

<script src="js/config/env.js"></script>
<script src="js/lib/supabase.js"></script>
<script src="js/admin/nav.js"></script>
<script src="js/core/helpers.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/admin/store.js"></script>
<script src="js/admin/sheet.js"></script>
<script src="js/admin/auth.js"></script>
<script src="js/admin/inquiries.js"></script>
<script src="js/admin/projects.js"></script>
<script src="js/admin/calendar.js"></script>
<script src="js/admin/dashboard.js"></script>
<script src="js/admin/packages.js"></script>
<script src="js/admin/testimonials.js"></script>
<script src="js/admin/site.js"></script>
<script src="js/admin/albums.js"></script>
<script src="js/main.js"></script>
</body>
</html>
